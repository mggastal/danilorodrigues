<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Danilo Rodrigues 15300 — Deputado Estadual</title>
<link rel="icon" type="image/png" href="favicon-danilo.png">
<style>
  @font-face{font-family:'Gilroy';src:url('fontes/Gilroy-Regular.ttf') format('truetype');font-weight:400;font-style:normal;font-display:swap;}
  @font-face{font-family:'Gilroy';src:url('fontes/Gilroy-Medium.ttf') format('truetype');font-weight:500;font-style:normal;font-display:swap;}
  @font-face{font-family:'Gilroy';src:url('fontes/Gilroy-SemiBold.ttf') format('truetype');font-weight:600;font-style:normal;font-display:swap;}
  @font-face{font-family:'Gilroy';src:url('fontes/Gilroy-Bold.ttf') format('truetype');font-weight:700;font-style:normal;font-display:swap;}
  @font-face{font-family:'Gilroy';src:url('fontes/Gilroy-ExtraBold.ttf') format('truetype');font-weight:800;font-style:normal;font-display:swap;}
  @font-face{font-family:'Gilroy';src:url('fontes/Gilroy-Black.ttf') format('truetype');font-weight:900;font-style:normal;font-display:swap;}
  @font-face{font-family:'Gilroy';src:url('fontes/Gilroy-BlackItalic.ttf') format('truetype');font-weight:900;font-style:italic;font-display:swap;}

  :root{
    --blue-deep:#061A3D;
    --blue-mid:#0367B0;
    --blue-panel:#04519A;
    --blue-panel-2:#0A2352;
    --teal:#00AFEF;
    --gold:#FDB92E;
    --gold-soft:#FFD37A;
    --cream:#F5F7FA;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--blue-deep);
    color:var(--cream);
    font-family:'Gilroy',sans-serif;
    line-height:1.6;
    overflow-x:hidden;
  }
  .display{font-family:'Gilroy',sans-serif;font-weight:800;text-transform:uppercase;letter-spacing:0.01em;}
  a{color:inherit;}
  img{max-width:100%;display:block;}
  .wrap{max-width:1180px;margin:0 auto;padding:0 32px;}

  /* ---------- HERO ---------- */
  .hero{
    position:relative;
    min-height:100vh;
    padding:0;
    background:linear-gradient(160deg, rgba(6,26,61,0.35), rgba(6,26,61,0.72)), url('bg-danilo-rodrigues.jpg') center/cover no-repeat;
  }
  .hero-photo{
    position:absolute;top:40px;left:0;bottom:0;width:42%;
    z-index:2;overflow:hidden;
  }
  .hero-photo img{
    position:absolute;inset:0;width:100%;height:100%;
    object-fit:contain;object-position:left bottom;
    display:block;
  }
  .hero-content{
    margin-left:42%;
    padding:80px 64px 90px;display:flex;flex-direction:column;justify-content:flex-start;
    max-width:640px;position:relative;z-index:2;
  }
  .eyebrow{font-size:15px;letter-spacing:0.14em;color:var(--gold-soft);margin-bottom:14px;}
  .hero-logo{width:100%;max-width:420px;height:auto;}
  .hero-numero{width:100%;max-width:340px;height:auto;margin-top:8px;}
  .cargo{
    display:inline-block;margin-top:20px;font-family:'Gilroy',sans-serif;font-weight:800;
    font-size:14px;letter-spacing:0.12em;color:var(--gold);
    border-top:2px solid var(--gold);border-bottom:2px solid var(--gold);padding:6px 0;
  }
  .hero-slogan{width:100%;max-width:280px;height:auto;margin-top:30px;}
  .hero-actions{display:flex;gap:32px;margin-top:40px;flex-wrap:wrap;}
  .link-cta{
    font-family:'Gilroy',sans-serif;font-weight:800;font-size:16px;letter-spacing:0.06em;
    color:var(--cream);text-decoration:none;padding-bottom:5px;border-bottom:2px solid var(--gold);
  }
  .link-cta.ghost{color:rgba(245,247,250,0.65);border-bottom-color:rgba(245,247,250,0.3);}
  @media(max-width:860px){
    .hero{min-height:auto;display:flex;flex-direction:column;}
    .hero-photo{position:static;width:100%;height:auto;order:2;}
    .hero-photo img{
      position:static;display:block;margin:0 auto;
      width:55%;max-width:300px;height:auto;
      object-fit:unset;object-position:unset;
    }
    .hero-content{order:1;margin-left:0;padding:20px 28px 6px;max-width:none;align-items:center;text-align:center;}
    .hero-logo{max-width:280px;}
    .hero-numero{max-width:136px;margin-top:4px;}
    .hero-slogan{max-width:190px;}
    .hero-logo,.hero-numero,.hero-slogan{margin-left:auto;margin-right:auto;}
    .hero-actions{display:none;}
  }
  @media(max-width:420px){
    .wrap{padding:0 20px;}
    .hero-content{padding-left:20px;padding-right:20px;}
  }

  /* ---------- SECTION SHELL ---------- */
  section{padding:100px 0;}
  .section-head{max-width:620px;margin-bottom:52px;}
  .section-eyebrow{font-family:'Gilroy',sans-serif;font-weight:800;font-size:14px;letter-spacing:0.1em;color:var(--gold-soft);margin-bottom:12px;}
  .section-head h2{font-family:'Gilroy',sans-serif;font-weight:900;font-style:italic;font-size:clamp(33px,4.4vw,48px);color:var(--cream);}
  .section-head p{margin-top:14px;font-size:18px;color:rgba(245,247,250,0.65);}

  /* ---------- REDES ---------- */
  .redes{
    background:linear-gradient(155deg, var(--blue-panel-2) 0%, var(--blue-mid) 100%);
    text-align:center;position:relative;overflow:hidden;padding:110px 0;
  }
  .redes .section-head{margin-left:auto;margin-right:auto;text-align:center;}
  .redes-links{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:8px;position:relative;z-index:2;}
  .rede-item{
    padding:15px 26px;border-radius:6px;border:1.5px solid rgba(245,247,250,0.35);
    font-family:'Gilroy',sans-serif;font-weight:800;font-size:14px;letter-spacing:0.04em;
    min-width:150px;text-align:center;color:var(--cream);text-decoration:none;
    display:flex;align-items:center;justify-content:center;gap:10px;
  }
  .rede-item svg{width:18px;height:18px;flex-shrink:0;}

  /* ---------- CTA FINAL ---------- */
  .cta-final{
    text-align:center;padding:120px 0;
    background:linear-gradient(160deg, var(--blue-panel) 0%, var(--blue-deep) 100%);
  }
  .cta-final h2{font-family:'Gilroy',sans-serif;font-weight:900;font-style:italic;font-size:clamp(32px,5vw,54px);color:var(--cream);margin-bottom:26px;}
  .cta-numero{width:100%;max-width:360px;height:auto;margin:0 auto 10px;}
  .cta-final .cargo{margin-top:0;}

  /* ---------- FOOTER ---------- */
  footer{background:var(--blue-deep);padding:40px 0 32px;font-size:13px;color:rgba(245,247,250,0.5);border-top:1px solid rgba(245,247,250,0.1);text-align:center;}
  footer .foot-top{margin-bottom:22px;}
  .foot-logo{height:30px;width:auto;margin:0 auto;}
  .foot-legal-row{
    display:flex;flex-direction:column;align-items:center;gap:6px;padding-top:20px;
    border-top:1px solid rgba(245,247,250,0.1);line-height:1.6;
  }
  .foot-credit{
    margin-top:22px;padding-top:16px;border-top:1px solid rgba(245,247,250,0.1);
    font-size:12px;
  }
  .foot-credit a{color:rgba(245,247,250,0.6);text-decoration:underline;}

  @media(prefers-reduced-motion: reduce){html{scroll-behavior:auto;}}
</style>
</head>
<body>

<section class="hero">
  <div class="hero-photo">
    <img src="foto-oficial-danilo-rodrigues.png" alt="Danilo Rodrigues">
  </div>
  <div class="hero-content">
    <img src="danilo-rodrigues-branca.png" alt="Danilo Rodrigues — Deputado Estadual" class="hero-logo">
    <img src="numero.png" alt="15300" class="hero-numero">
    <img src="slogan-fundo-escuro.png" alt="Quem é da nossa terra, luta pela nossa gente!" class="hero-slogan">
    <div class="hero-actions">
      <a href="#redes" class="link-cta">Redes sociais →</a>
    </div>
  </div>
</section>

<section class="redes" id="redes">
  <div class="wrap">
    <div class="section-head">
      <div class="section-eyebrow display">Acompanhe de perto</div>
      <h2>Redes sociais</h2>
      <p>Links para os perfis oficiais da campanha.</p>
    </div>
    <div class="redes-links">
      <a class="rede-item" href="https://www.instagram.com/danilorodrigues_rs/" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1"/></svg>
        Instagram
      </a>
      <a class="rede-item" href="https://www.facebook.com/danilo.rodrigues.9828456" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="5"/><path d="M14 21v-7h2.2l.3-2.6H14v-1.7c0-.75.2-1.3 1.3-1.3H16.6V6.1c-.23-.03-1-.1-1.9-.1-1.9 0-3.2 1.15-3.2 3.3v1.8H9.3v2.6H11.5v7" fill="currentColor" stroke="none"/></svg>
        Facebook
      </a>
    </div>
  </div>
</section>

<section class="cta-final" id="cta">
  <div class="wrap">
    <h2>No dia da eleição, vote</h2>
    <img src="numero.png" alt="15300" class="cta-numero">
  </div>
</section>

<footer>
  <div class="wrap">
    <div class="foot-top">
      <img src="danilo-rodrigues-branca.png" alt="Danilo Rodrigues" class="foot-logo">
    </div>
    <div class="foot-legal-row">
      <p>CNPJ: 68.518.671/0001-82</p>
      <p>Eleição 2026 — Danilo Rodrigues — Deputado Estadual</p>
    </div>
  </div>
</footer>

</body>
</html>
